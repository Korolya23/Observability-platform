services:
  # ===========================================
  # Observability Stack
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerting/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - observability

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/config.yaml" ]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - observability

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.90.1
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - prometheus
    networks:
      - observability

  # ===========================================
  # Demo Application - All Services
  # ===========================================
  frontend:
    image: gcr.io/google-samples/microservices-demo/frontend:v0.6.0
    container_name: frontend
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=frontend
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    ports:
      - "8080:8080"
    depends_on:
      - currencyservice
      - productcatalogservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
    networks:
      - observability
    restart: unless-stopped

  productcatalogservice:
    image: gcr.io/google-samples/microservices-demo/productcatalogservice:v0.6.0
    container_name: productcatalogservice
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=productcatalogservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  currencyservice:
    image: gcr.io/google-samples/microservices-demo/currencyservice:v0.6.0
    container_name: currencyservice
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=currencyservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  cartservice:
    image: gcr.io/google-samples/microservices-demo/cartservice:v0.6.0
    container_name: cartservice
    environment:
      - PORT=7070
      - REDIS_ADDR=redis:6379
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=cartservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    depends_on:
      - redis
    networks:
      - observability
    restart: unless-stopped

  recommendationservice:
    image: gcr.io/google-samples/microservices-demo/recommendationservice:v0.6.0
    container_name: recommendationservice
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=recommendationservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  shippingservice:
    image: gcr.io/google-samples/microservices-demo/shippingservice:v0.6.0
    container_name: shippingservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=shippingservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  checkoutservice:
    image: gcr.io/google-samples/microservices-demo/checkoutservice:v0.6.0
    container_name: checkoutservice
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CART_SERVICE_ADDR=cartservice:7070
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:5000
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=checkoutservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    depends_on:
      - paymentservice
      - emailservice
    networks:
      - observability
    restart: unless-stopped

  paymentservice:
    image: gcr.io/google-samples/microservices-demo/paymentservice:v0.6.0
    container_name: paymentservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=paymentservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  emailservice:
    image: gcr.io/google-samples/microservices-demo/emailservice:v0.6.0
    container_name: emailservice
    environment:
      - PORT=5000
      - DISABLE_PROFILER=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=emailservice
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=online-boutique
    networks:
      - observability
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - observability
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  observability:
    driver: bridge