groups:
  - name: microservices
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket{service="frontend"}[5m])) by (le, service)) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency on {{ $labels.service }}"
          description: "95th percentile latency is {{ $value }}ms (threshold 500ms)"