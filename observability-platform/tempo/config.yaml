server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  max_block_bytes: 1_000_000
  flush_all_on_shutdown: true

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal