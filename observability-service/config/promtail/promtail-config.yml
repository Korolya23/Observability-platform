server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/com.docker.compose.service.(.+)'
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            trace_id: 'trace_id'
            span_id: 'span_id'
            severity: 'severity_text'
            body: 'body'
      - labels:
          trace_id:
          span_id:
          severity:
      - output:
          source: body